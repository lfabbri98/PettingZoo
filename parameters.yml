# Parametri del simulatore
window:
  width: 1000
  height: 650
  title: "Tennis simulator"
  fps: 60

court:
  width: 300
  height: 500

ball:
  max_speed: 350  # pixel al secondo

player:
  width: 55
  height: 18
  speed: 200  # pixel al secondo
  max_shot_angle: 35  # gradi rispetto al colpo dritto

colors:
  court: [52, 122, 76]
  lines: [245, 245, 240]
  player_top: [210, 76, 72]
  player_bottom: [48, 118, 195]
  background: [25, 25, 25]
